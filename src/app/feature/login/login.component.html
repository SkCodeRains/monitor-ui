<div class="login-page">
  <div class="login-card glass-panel animate-fade-in">
    <!-- Logo & Header -->
    <div class="login-header">
      <div class="brand-logo">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
        >
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
          <path d="M7 10l3 3 7-7"></path>
        </svg>
      </div>
      <h1 class="login-title">Data Stream Monitor</h1>
      <p class="login-subtitle">Sign in to access real-time live events and trash archive</p>
    </div>

    <!-- Error Banner -->
    @if (authService.authError()) {
      <div class="error-banner animate-fade-in">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ authService.authError() }}</span>
      </div>
    }

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="skcoderains@gmail.com"
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-input-wrapper">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            required
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="btn-toggle-pw"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            @if (showPassword()) {
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                ></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            } @else {
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            }
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="apiKey">API Access Key</label>
        <div class="password-input-wrapper">
          <input
            id="apiKey"
            [type]="showApiKey() ? 'text' : 'password'"
            [(ngModel)]="apiKey"
            name="apiKey"
            required
            placeholder=""
            autocomplete="off"
            spellcheck="false"
          />
          <button
            type="button"
            class="btn-toggle-pw"
            (click)="showApiKey.set(!showApiKey())"
            [attr.aria-label]="showApiKey() ? 'Hide API key' : 'Show API key'"
          >
            @if (showApiKey()) {
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                ></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            } @else {
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Quick Auto-Fill helper -->
      <div class="quick-fill-row">
        <button type="button" class="btn-quick-fill" (click)="quickFill()">
          ✨ Auto-Fill Admin Credentials & API Key
        </button>
      </div>

      <button
        type="submit"
        class="btn-submit"
        [disabled]="authService.isLoading() || !email || !password || !apiKey"
      >
        @if (authService.isLoading()) {
          <span class="spinner-sm"></span>
          <span>Authenticating...</span>
        } @else {
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          <span>Sign In to Dashboard</span>
        }
      </button>
    </form>

    <div class="login-footer">
      <p class="notice">
        🔒 Telemetry POST API is public. Dashboard stream viewing & management is secured with JWT +
        x-api-key authentication.
      </p>
    </div>
  </div>
</div>
